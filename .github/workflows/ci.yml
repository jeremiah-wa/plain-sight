name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the uv version so CI is reproducible; bump deliberately.
  UV_VERSION: "0.9.5"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip commit.

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync (all extras + dev)
        run: uv sync --all-extras --dev --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned to the deployment target's version (Supabase reports 17.6), the
        # same pin as the `db` service in compose.yaml. Keep the two in step.
        image: postgres:17.6
        env:
          POSTGRES_USER: plain_sight
          POSTGRES_PASSWORD: plain_sight
          POSTGRES_DB: plain_sight_test
        ports:
          - 5432:5432
        # Hold the job's start until Postgres is accepting connections.
        options: >-
          --health-cmd "pg_isready -U plain_sight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Points the @pytest.mark.postgres tests at the service container above,
      # rather than at the compose default they would otherwise fall back to.
      # Loopback with a *_test database, so it satisfies the fixture's guardrail.
      PLAIN_SIGHT_TEST_DATABASE_URL: postgresql://plain_sight:plain_sight@localhost:5432/plain_sight_test
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync (all extras + dev)
        run: uv sync --all-extras --dev --frozen

      - name: pytest
        run: uv run pytest
