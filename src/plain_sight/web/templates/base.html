<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Plain Sight verification{% endblock %}</title>
    <!-- Minimal HTMX for partial swaps. The forms below also submit as plain
         POSTs, so the app still works if this script fails to load. -->
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <style>
      :root {
        color-scheme: light dark;
        --line: #d0d0d0;
        --muted: #666;
        --accent: #1a5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        line-height: 1.5;
      }
      header {
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--line);
      }
      header a {
        text-decoration: none;
        font-weight: 600;
      }
      main {
        padding: 1.25rem;
        max-width: 1100px;
        margin: 0 auto;
      }
      .muted {
        color: var(--muted);
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 1rem 1.25rem;
      }
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 1.25rem;
      }
      @media (max-width: 800px) {
        .split {
          grid-template-columns: 1fr;
        }
      }
      embed,
      object {
        width: 100%;
        height: 640px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      label {
        display: block;
        margin: 0.75rem 0 0.25rem;
        font-weight: 600;
        font-size: 0.9rem;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 0.45rem 0.55rem;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: transparent;
        color: inherit;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        border: 1px solid var(--line);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .message {
        font-weight: 600;
      }
      ul.queue {
        list-style: none;
        padding: 0;
      }
      ul.queue li {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.75rem 1rem;
        margin-bottom: 0.6rem;
      }
      dl.provenance {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.15rem 0.75rem;
        font-size: 0.85rem;
        margin: 0.5rem 0 0;
      }
      dl.provenance dt {
        color: var(--muted);
      }
      dl.provenance dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">Plain Sight, verification</a>
      <span class="muted">, operator-only, local</span>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
